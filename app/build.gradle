plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aulaiag.reto11'
    compileSdk 36

    defaultConfig {
        applicationId 'com.aulaiag.reto11'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'com.aulaiag.reto11.DeviceChecks'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
