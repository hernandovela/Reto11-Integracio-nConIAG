import java.text.Normalizer

plugins {
    id 'com.android.application'
}

def modulePath = layout.projectDirectory.asFile.absolutePath
def onWindows = System.getProperty('os.name').startsWith('Windows')
if (onWindows && !Normalizer.isNormalized(modulePath, Normalizer.Form.NFC)) {
    // The Android resource parser normalizes file paths to NFC when reading generated XML.
    def cacheKey = UUID.nameUUIDFromBytes(modulePath.getBytes('UTF-8'))
    layout.buildDirectory.set(new File(gradle.gradleUserHomeDir, "caches/aula-iag/${cacheKey}/app"))
}

android {
    namespace 'com.aulaiag.reto11'
    compileSdk 36

    defaultConfig {
        applicationId 'com.aulaiag.reto11'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1'
        testInstrumentationRunner 'com.aulaiag.reto11.DeviceChecks'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
}
